name: Start local unbound
description: >
  Starts a local recursive resolver and smoke-tests it. Running our own
  recursion is what keeps the DoH fallback tier inside its 1-3% budget and what
  makes authentic NXDOMAIN/NODATA distinctions visible rather than a public
  resolver's cached approximation.

runs:
  using: composite
  steps:
    - name: Install and start unbound
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq unbound dnsutils
        # The trust anchor is what makes the AD flag meaningful. Failing to
        # fetch it costs DNSSEC data, not the crawl, so it must not abort here.
        sudo unbound-anchor -a /var/lib/unbound/root.key || true
        sudo unbound -c "$GITHUB_WORKSPACE/infra/unbound.conf"

    - name: Smoke-test the resolver
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
          if dig @127.0.0.1 google.com +short +time=3 | grep -q .; then
            echo "unbound answering after ${attempt} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "::error::local unbound is not answering; refusing to crawl"
        exit 1
