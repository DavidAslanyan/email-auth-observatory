name: Aggregate

# Manual only. The crawl workflows each run their own aggregate as a dependent
# job, so it happens exactly when a crawl actually did work. Chaining this by
# workflow_run fired even when the crawl job was skipped, which is how a rest
# day still produced a commit.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm observatory aggregate
      - uses: ./.github/actions/commit-data
        with:
          summary: aggregate
          paths: data/aggregates
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
