name: Crawl tier 1

# Three slots a day, of which the day's plan may use none, one, two or all
# three. See scripts/schedule.mjs.
on:
  schedule:
    - cron: '5 1 * * *'
    - cron: '5 9 * * *'
    - cron: '5 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Work out which slot this is
        id: slot
        run: |
          case "$(date -u +%-H)" in
            1) echo "n=0" >> "$GITHUB_OUTPUT" ;;
            9) echo "n=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "n=2" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: plan
        uses: ./.github/actions/plan
        with:
          kind: tier1
          slot: ${{ steps.slot.outputs.n }}

  crawl:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch tip, not the SHA that triggered this run. A job that
          # writes data must see what earlier jobs and runs already committed —
          # otherwise it diffs against a stale tree and silently finds nothing
          # to do, which is exactly what the aggregate job did.
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver
      - run: pnpm observatory crawl --tier 1
      - uses: ./.github/actions/commit-data
        with:
          summary: tier1 crawl
          paths: data
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}

  # Runs only when the crawl actually ran. Previously this was a separate
  # workflow chained by workflow_run, which fired even when the crawl job was
  # skipped — so a rest day still produced an aggregate commit.
  aggregate:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch tip, not the SHA that triggered this run. A job that
          # writes data must see what earlier jobs and runs already committed —
          # otherwise it diffs against a stale tree and silently finds nothing
          # to do, which is exactly what the aggregate job did.
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm observatory aggregate
      - uses: ./.github/actions/commit-data
        with:
          summary: aggregate
          paths: data/aggregates
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
