name: Crawl tier 1

on:
  schedule:
    # Twice a day, not four times. The top 1,000 do not change hourly, and this
    # halves the query volume against a free public resolver.
    - cron: '5 1 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Every data-writing workflow shares one group. Never cancel: a cancelled
  # crawl loses the work it has done rather than merely delaying it.
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./.github/actions/quiet-day

  crawl:
    needs: schedule
    if: needs.schedule.outputs.quiet != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver
      - run: pnpm observatory crawl --tier 1
      - uses: ./.github/actions/commit-data
        with:
          summary: tier1 crawl
          paths: data
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
