name: Crawl tier 2

# Eight slots a day, of which the day's plan may use anywhere from none to all
# eight. The long-tail shard each slot crawls is derived by replaying the plan,
# so the 28-shard rotation stays round-robin however the intensity varies.
on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 3 * * *'
    - cron: '20 6 * * *'
    - cron: '20 9 * * *'
    - cron: '20 12 * * *'
    - cron: '20 15 * * *'
    - cron: '20 18 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: Shard to crawl (0-27). Leave empty to use the plan.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      shard: ${{ steps.plan.outputs.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Work out which slot this is
        id: slot
        run: echo "n=$(( $(date -u +%-H) / 3 ))" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: ./.github/actions/plan
        with:
          kind: tier2
          slot: ${{ steps.slot.outputs.n }}

  crawl:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver
      - name: Crawl shard
        run: |
          set -euo pipefail
          SHARD="${{ inputs.shard }}"
          [ -n "$SHARD" ] || SHARD="${{ needs.plan.outputs.shard }}"
          echo "crawling shard ${SHARD}"
          pnpm observatory crawl --tier 2 --shard "$SHARD"
      - uses: ./.github/actions/commit-data
        with:
          summary: tier2 shard crawl
          paths: data
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}

  aggregate:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm observatory aggregate
      - uses: ./.github/actions/commit-data
        with:
          summary: aggregate
          paths: data/aggregates
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
