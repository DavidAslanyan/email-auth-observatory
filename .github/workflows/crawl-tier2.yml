name: Crawl tier 2

on:
  schedule:
    # Two shards a day at well-separated times. With 28 shards that is full
    # long-tail coverage every fortnight, arriving as two modest bursts rather
    # than one sustained hour at full rate.
    - cron: '20 5 * * *'
    - cron: '20 17 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: Shard to crawl (0-27). Leave empty to pick from the day of year.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./.github/actions/quiet-day

  crawl:
    needs: schedule
    if: needs.schedule.outputs.quiet != 'true'
    runs-on: ubuntu-latest
    # Under the 360-minute hard limit, leaving room to commit. A crawl killed at
    # the limit resumes from its checkpoint on the next run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver
      - name: Crawl shard
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.shard }}" ]; then
            pnpm observatory crawl --tier 2 --shard "${{ inputs.shard }}"
            exit 0
          fi
          # The two daily runs share a rotation; the hour tells them apart so
          # they advance through the shards together rather than repeating one.
          HOUR=$(date -u +%-H)
          SLOT=0
          [ "$HOUR" -ge 12 ] && SLOT=1
          echo "slot ${SLOT} (hour ${HOUR} UTC)"
          pnpm observatory crawl --tier 2 --auto --slot "$SLOT" --slots-per-day 2
      - uses: ./.github/actions/commit-data
        with:
          summary: tier2 shard crawl
          paths: data
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
