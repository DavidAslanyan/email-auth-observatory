name: Daily report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Date to report on (YYYY-MM-DD). Defaults to today, UTC.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: observatory-data-write
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./.github/actions/quiet-day

  report:
    needs: schedule
    if: needs.schedule.outputs.quiet != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Generate report
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            pnpm observatory report --date "${{ inputs.date }}"
          else
            pnpm observatory report
          fi
      - uses: ./.github/actions/commit-data
        with:
          summary: daily report
          paths: reports
          name: ${{ vars.COMMIT_NAME }}
          email: ${{ vars.COMMIT_EMAIL }}
