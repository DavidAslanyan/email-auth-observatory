name: Verify runner DNS

# Run this BEFORE trusting the scheduled crawls. GitHub-hosted runners may
# throttle high-volume outbound UDP/53, which would show up as an elevated
# unknown rate rather than as an error. If this reports a bad rate, the fallback
# is a small VPS running the same CLI on cron — which is arguably the better
# architecture anyway (warm resolver cache, no six-hour job limit).
on:
  workflow_dispatch:
    inputs:
      domains:
        description: How many domains to resolve.
        required: false
        default: '1000'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver

      - name: Crawl without writing anything, and judge the unknown rate
        run: |
          set -euo pipefail
          # --dry-run writes nothing; the run summary still goes to stdout.
          pnpm --silent mailscape crawl --tier 1 --limit "${{ inputs.domains }}" --dry-run \
            | tee /tmp/summary.json

          SUMMARY=$(grep -o '{"command".*}' /tmp/summary.json | tail -1)
          RATE=$(printf '%s' "$SUMMARY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).unknownRate))')
          LOCAL=$(printf '%s' "$SUMMARY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d);console.log(s.byResolver.local)})')
          TOTAL=$(printf '%s' "$SUMMARY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).lookupsTotal))')

          {
            echo "### Runner DNS check"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Lookups | ${TOTAL} |"
            echo "| Answered locally | ${LOCAL} |"
            echo "| Unknown rate | ${RATE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "unknown rate: ${RATE} over ${TOTAL} lookups (${LOCAL} answered by local unbound)"

          # 2% is the threshold above which a real run is marked degraded.
          if awk "BEGIN { exit !(${RATE} > 0.02) }"; then
            echo "::error::unknown rate ${RATE} exceeds 2% — outbound UDP/53 is likely throttled on this runner"
            exit 1
          fi
          echo "outbound UDP/53 looks healthy on GitHub-hosted runners"
