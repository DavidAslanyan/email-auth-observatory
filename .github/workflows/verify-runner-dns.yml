name: Verify resolver

# Confirms the crawl resolves cleanly on whichever resolver this repository is
# configured to use, and — importantly — that the tier actually carrying the
# traffic is the one we think is carrying it.
#
# Set `local: true` to test a self-hosted runner with real recursion. On
# GitHub-hosted runners that is expected to fail: outbound UDP/53 is throttled
# there, and a root server becomes unreachable a few hundred queries into a
# crawl. See docs/METHODOLOGY.md.
on:
  workflow_dispatch:
    inputs:
      domains:
        description: How many domains to resolve.
        required: false
        default: '400'
        type: string
      local:
        description: Use a local unbound instead of DoH (self-hosted runners only).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/resolver
        with:
          local: ${{ inputs.local }}

      - name: Crawl without writing anything, and judge the result
        run: |
          set -euo pipefail
          pnpm --silent observatory crawl --tier 1 --limit "${{ inputs.domains }}" --dry-run \
            | tee /tmp/summary.json

          SUMMARY=$(grep -o '{"command".*}' /tmp/summary.json | tail -1)
          read -r RATE LOCAL DOH TOTAL <<<"$(printf '%s' "$SUMMARY" | node -e '
            let d = "";
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              const s = JSON.parse(d);
              const doh = s.byResolver["doh-cloudflare"] + s.byResolver["doh-google"];
              console.log(s.unknownRate, s.byResolver.local, doh, s.lookupsTotal);
            });
          ')"

          # Which tier is SUPPOSED to be carrying the crawl.
          if [ "${{ inputs.local }}" = "true" ]; then
            EXPECTED="local"; CARRIED="$LOCAL"
          else
            EXPECTED="DoH"; CARRIED="$DOH"
          fi
          SHARE=$(awk "BEGIN { printf \"%.4f\", ${CARRIED} / ${TOTAL} }")

          {
            echo "### Resolver check"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Configured tier | ${EXPECTED} |"
            echo "| Lookups | ${TOTAL} |"
            echo "| Answered by ${EXPECTED} | ${CARRIED} (${SHARE}) |"
            echo "| Answered locally | ${LOCAL} |"
            echo "| Answered over DoH | ${DOH} |"
            echo "| Unknown rate | ${RATE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "unknown rate ${RATE}; ${EXPECTED} carried ${CARRIED}/${TOTAL} (${SHARE})"

          STATUS=0

          # 2% is the threshold above which a real run is marked degraded.
          if awk "BEGIN { exit !(${RATE} > 0.02) }"; then
            echo "::error::unknown rate ${RATE} exceeds 2%"
            STATUS=1
          fi

          # The unknown rate alone is NOT sufficient: a broken tier hides behind
          # a healthy rate because the next tier catches everything it drops.
          if awk "BEGIN { exit !(${SHARE} < 0.95) }"; then
            echo "::error::the ${EXPECTED} tier answered only ${SHARE} of lookups; another tier is carrying the crawl"
            if [ "${{ inputs.local }}" = "true" ]; then
              echo "--- unbound service state ---"; sudo systemctl status unbound --no-pager || true
              echo "--- unbound log ---";           sudo journalctl -u unbound --no-pager -n 60 || true
              echo "--- can this runner reach an authoritative server directly? ---"
              dig @198.41.0.4 . NS +short +time=5 +tries=1 || echo "  a.root-servers.net UNREACHABLE over UDP/53"
              dig @1.1.1.1 google.com +short +time=5 +tries=1 || echo "  1.1.1.1 UNREACHABLE over UDP/53"
            fi
            STATUS=1
          fi

          [ "$STATUS" -eq 0 ] && echo "resolver healthy: the ${EXPECTED} tier is carrying the crawl"
          exit "$STATUS"
