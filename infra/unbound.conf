# Recursive resolver for mailscape crawls.
#
# Running our own recursion rather than hammering a public resolver is what
# keeps the DoH tier at the 1-3% of traffic it is budgeted for, and it is the
# only way to see authentic NXDOMAIN/NODATA distinctions rather than a public
# resolver's cached approximations.
server:
  interface: 127.0.0.1
  port: 53
  access-control: 127.0.0.0/8 allow

  # Send only the minimum query name to each authoritative server.
  qname-minimisation: yes
  auto-trust-anchor-file: "/var/lib/unbound/root.key"

  # A crawl wants current data, not cached data: honour zero-TTL answers, and
  # never hold anything longer than an hour.
  cache-min-ttl: 0
  cache-max-ttl: 3600

  num-threads: 4
  msg-cache-size: 128m
  rrset-cache-size: 256m

  # A 100-concurrency crawl keeps thousands of queries in flight; the defaults
  # here are sized for a desktop and will drop queries under that load.
  outgoing-range: 8192
  num-queries-per-thread: 4096

  do-not-query-localhost: no
  hide-identity: yes
  hide-version: yes
